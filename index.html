<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<title>Vocal Sessions</title>
<style>
:root{
  --bg:#f2f2f7;--surface:#ffffff;--fg:#000000;--fg2:#6c6c72;--fg3:#a3a3a8;
  --sep:rgba(60,60,67,0.16);--fill:rgba(118,118,128,0.12);
  --accent:#007aff;--on-accent:#ffffff;--danger:#ff3b30;--star:#ff9f0a;--rec:#ff3b30;--good:#34c759;
  --done:#8e8e93;--on-done:#ffffff;
  --glass:rgba(250,250,252,0.62);--glass-strong:rgba(250,250,252,0.86);
  --glass-edge:rgba(0,0,0,0.09);--glass-hi:rgba(255,255,255,0.95);
  --glass-shadow:rgba(20,20,40,0.14);--scrim:rgba(0,0,0,0.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--surface:#1c1c1e;--fg:#ffffff;--fg2:#98989f;--fg3:#5c5c61;
  --sep:rgba(84,84,88,0.5);--fill:rgba(118,118,128,0.24);
  --accent:#0a84ff;--danger:#ff453a;--star:#ffb340;--rec:#ff453a;--good:#30d158;
  --done:#636366;--on-done:#ffffff;
  --glass:rgba(40,40,44,0.58);--glass-strong:rgba(44,44,48,0.86);
  --glass-edge:rgba(0,0,0,0.6);--glass-hi:rgba(255,255,255,0.2);
  --glass-shadow:rgba(0,0,0,0.5);--scrim:rgba(0,0,0,0.5);color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:430px;margin:0 auto;position:relative}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 0.5px var(--glass-edge),0 8px 28px var(--glass-shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -8px;padding:0 8px;border-radius:0 0 22px 22px;transition:background .25s,box-shadow .25s}
.bar:not(.scrolled){background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.bar .mt{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.scrolled .mt,.bar.always .mt{opacity:1}
.side{min-width:44px;display:flex;gap:6px;align-items:center}.side.r{justify-content:flex-end}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex-shrink:0}
.pill{font-size:13px;font-weight:600;color:var(--fg2);padding:9px 12px;border-radius:999px;white-space:nowrap}

h1{font-size:34px;font-weight:700;letter-spacing:0.01em;margin:0 4px 6px}
.note{font-size:13px;color:var(--fg2);margin:0 4px 14px;line-height:1.4}
.foot{font-size:13px;color:var(--fg2);margin:7px 16px 0;line-height:1.4}
.foot.warn{color:var(--danger)}
.hdr{font-size:13px;color:var(--fg2);margin:22px 16px 7px;text-transform:uppercase;letter-spacing:0.03em}
.grp{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:6px 16px;position:relative;width:100%;background:var(--surface)}
.grp>*{position:relative}
.grp>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:0.5px solid var(--sep);z-index:2}
.grp>.sub::before{display:none}
.lbl{flex:1;min-width:0}
.lbl small{display:block;font-size:13px;color:var(--fg2);margin-top:2px}
.mut{color:var(--fg2)}.acc{color:var(--accent)}.dng{color:var(--danger)}
.sub{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;gap:10px;background:var(--surface)}
.tag{font-size:13px;color:var(--fg2)}

.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.seg button{min-width:44px;height:34px;border-radius:999px;font-size:15px;font-weight:500;color:var(--fg2);text-align:center;transition:background .15s,color .15s}
.seg button.on{color:var(--fg);background:var(--surface);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 8px var(--glass-shadow),inset 0 0 0 0.5px var(--glass-edge)}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;color:var(--fg)}
.chip.on{background:var(--accent);color:var(--on-accent)}

.arch{position:relative;max-width:300px;margin:6px auto 0}
.arch svg{display:block;width:100%;height:auto}
.arch .c{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.arch .c small{display:block;font-size:15px;color:var(--fg2)}
.arch .c b{display:block;font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.week{display:flex;justify-content:space-between;max-width:330px;margin:20px auto 10px}
.week span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--fg3);border:1.5px solid var(--sep)}
.week span.done{background:var(--done);border-color:var(--done);color:var(--on-done)}
.week span.today{border-color:var(--fg);color:var(--fg)}
.week span.today.done{border-color:var(--done)}
.streak{text-align:center;font-size:17px;margin:4px 0 0}
.streak small{display:block;font-size:15px;color:var(--fg2);margin-top:3px}
.track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.track i.full{background:var(--good)}

.cta{display:block;height:54px;border-radius:999px;font-size:17px;font-weight:600;color:var(--on-accent);background:var(--accent);text-align:center;width:100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),inset 0 0 0 0.5px rgba(0,0,0,0.12),0 8px 24px var(--glass-shadow)}
.cta.ink{background:var(--fg);color:var(--bg);box-shadow:0 8px 24px var(--glass-shadow)}
.cta.red{background:var(--danger)}
.cta:active,.circ:active,.row:active,.chip:active,.tabbar button:active{transform:scale(0.98)}
.ghost{display:block;width:100%;text-align:center;height:48px;color:var(--accent);font-weight:500;margin-top:4px}

main{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.dock .in{max-width:430px;margin:0 auto;pointer-events:auto}
.tabbar{display:flex;gap:2px;padding:5px;border-radius:999px;max-width:380px;margin:0 auto}
.tabbar button{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--fg);gap:3px;text-align:center}
.tabbar button.on{color:var(--accent);background:var(--fill)}

.sw{overflow:hidden;background:var(--danger)}
.sw .fg{position:relative;z-index:1;transition:transform .22s ease;background:var(--surface)}
.sw.dragging .fg{transition:none}
.sw .swdel{position:absolute;right:0;top:0;bottom:0;width:88px;color:#fff;font-weight:600;font-size:15px;text-align:center}

.ex-h{display:flex;flex-wrap:wrap;gap:8px;margin:2px 4px 14px}
.badge{font-size:13px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--fill);color:var(--fg2)}
.prose{padding:14px 16px;font-size:16px;line-height:1.45}
.prose ul{margin:0;padding-left:18px}.prose li+li{margin-top:10px}
.prose b{font-weight:600}
.chart{padding:12px 12px 8px}
.chart svg{display:block;width:100%;height:auto}

.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;margin:0 8px calc(8px + env(safe-area-inset-bottom,0px));border-radius:34px;padding:10px 16px 16px;background:var(--glass-strong);animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:700;margin:0 4px 12px}
.sheet .grp,.sheet .row{background:var(--surface)}
.sheet .hdr{margin-top:16px}
.field{width:100%;min-height:48px;border-radius:14px;background:var(--surface);border:0;padding:12px 14px;outline:none}
textarea.field{resize:none;min-height:84px;line-height:1.35}
.err{font-size:13px;color:var(--danger);margin:6px 4px 0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.empty{padding:22px 16px;text-align:center;color:var(--fg2);font-size:15px;line-height:1.4;background:var(--surface)}
.recbtn{justify-content:center;gap:10px;color:var(--fg)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--rec);display:inline-block;transition:border-radius .2s}
.recbtn.on .dot{border-radius:3px}
.recbtn.on{color:var(--rec);font-variant-numeric:tabular-nums}
.ibtn{width:40px;height:44px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}
.ibtn svg{width:20px;height:20px}
.star.on{color:var(--star)}.star.on svg{fill:currentColor}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar glass" id="bar">
    <span class="side" id="barL"></span>
    <span class="mt" id="barT"></span>
    <span class="side r" id="barR"></span>
  </header>
  <main id="app"></main>
</div>
<div class="dock"><div class="in" id="dock"></div></div>
<div id="layer"></div>
<input type="file" id="importIn" accept=".json,application/json" hidden>

<script>
/* ===== Config ===== */
const APP_VERSION='3.0';
const VIDEO='https://youtu.be/rG-o10NggDI';
const TARGET=280, WEEK_TARGET=70;
const UPDATE_DAY='14 Oct'; // counts saved before this date have no dates
const FOUND=[
  {id:'slides',name:'Vocal slides',focus:'agility'},
  {id:'humming',name:'Humming',focus:'cord-closure'},
  {id:'lip',name:'Lip bubbling',focus:'cord-closure'},
  {id:'straw',name:'Singing through a straw',focus:'cord-closure'}];
const ROT=[
  {id:'falsetto',name:'Falsetto voice',focus:'register'},
  {id:'upperlower',name:'Upper to lower voice',focus:'register'},
  {id:'rung',name:'Singing on the rung',focus:'resonance'},
  {id:'hinge',name:'Squeaky hinge',focus:'register'},
  {id:'half',name:'Half squeaky / half normal',focus:'blend'},
  {id:'vertical',name:'Vertical mouth',focus:'resonance'},
  {id:'nasal',name:'Nasal exercise',focus:'resonance'},
  {id:'flex',name:'Vocal flexibility',focus:'agility'}];
const OLD_ROT_IDS=['falsetto','upperlower','rung','hinge','half','vertical','nasal','flex'];
const FOCI=['cord-closure','register','resonance','agility','blend'];
const NOTE_PRESETS=['Felt good placement','Tight today','Clear tone','Cracking on passaggio','Flat pitch','Register blend improving','Needed more warm-up'];
const MAX_TAKE=120, KEEP_TAKES=3;

/* Exercise write-ups, from the "Vocal exercises descriptions" doc */
const DESC={
slides:{n:1,what:'Light, quiet glides from low to high and back on <i>hee, hoo, hoe, hah, hay</i>, keeping the buzz on the roof of your mouth. Short slides first, then medium, then your full range, bending forward on the top notes. Levels 2–3 add a bounce on the high notes.',
 why:'It’s the vocal equivalent of stretching before a workout. Sliding through every pitch with no gaps starts blending chest and head voice, and keeping it light teaches the voice to thin out as it rises instead of pushing.',
 song:[['Scoops and glides into notes','R&amp;B singers constantly slide into a note rather than hitting it dead-on. Bruno Mars’s slides up into falsetto on <i>Leave the Door Open</i> are that siren in miniature.'],['Wide-range songs','Do them before any song that runs from a low verse to a high chorus. Singers say slides right before a show make it feel like their range is opening.']]},
humming:{n:2,what:'Humming short melodic patterns with lips only lightly touching, quiet and relaxed, feeling a buzz around your nose and cheekbones (the “mask”).',
 why:'It’s the easiest way to find forward placement: the sound sits up front rather than falling into the back of the throat. That forward buzz keeps notes clear, in tune and easier to reach higher.',
 song:[['The first note','Soft openings like the first verse of John Legend’s <i>All of Me</i> need that placement from note one, or the whole verse sounds muffled.'],['Quiet, close-to-the-mic moments','Intimate R&amp;B verses (Daniel Caesar’s <i>Best Part</i>) are sung softly but still need to cut through. Humming trains “quiet but present”.']]},
lip:{n:3,what:'Blowing through loose lips to make a motorboat <i>brrr</i> while singing patterns through your whole range. If your lips won’t flutter, press your cheeks in and forward with your fingertips.',
 why:'It keeps lips, face and jaw relaxed from bottom to top, and it balances breath: too much air and the neck tenses, too little and the trill stops. The aim is to pass through chest, mix and head voice with no change in effort.',
 song:[['Running a whole song on a trill','Try your hardest song on lip trills first, then sing the words. It keeps your breathing going through the tricky parts.'],['Pre-show nerves','A go-to before going on stage for many singers. It also forces deeper breaths without you noticing.']]},
falsetto:{n:4,what:'Flowing, wave-like patterns in falsetto on <i>hoo</i>, <i>hee</i>, then <i>woh/wah</i>, at whatever volume feels comfortable. Teeth at least half an inch apart so the jaw doesn’t clamp.',
 why:'Falsetto is the light, breathy voice that’s disconnected from chest voice. This makes it comfortable and controllable, so it becomes a colour you choose rather than something you fall into.',
 song:[['Whole songs in falsetto','Curtis Mayfield’s <i>Superfly</i> is sung almost entirely in falsetto. MJ’s <i>Don’t Stop ’Til You Get Enough</i> is the same idea at dance tempo.'],['Soft R&amp;B texture','Daniel Caesar’s <i>Get You</i> lives in a light, airy upper voice. That relaxed falsetto is what this builds.'],['Hooks and ad-libs','Bruno Mars uses falsetto for the sweet, high moments in <i>Leave the Door Open</i> and <i>Versace on the Floor</i>.']]},
upperlower:{n:5,what:'Patterns that start high and descend on <i>woh</i> / <i>woo</i>, <i>we</i>, then <i>wah/way</i>, sung slowly and quietly, in “slow motion”, so you pass from head voice down into chest with no bump. Can also be done on lip trills or through a straw.',
 why:'Most people practise going up; this trains the way down. The goal is no audible change in tone as you cross between registers in either direction.',
 song:[['Coming down from a peak','After a high falsetto ad-lib, R&amp;B singers often slide straight back into the chest-voice melody. A clunk there sounds like two different singers.'],['Songs that sit between voices','Melodies that keep crossing between head and chest sound disjointed until the registers blend.']]},
straw:{n:6,what:'Humming and singing patterns through a straw into water, which adds slight resistance. Start with a wide straw and little water; it should feel soothing, never like work.',
 why:'It’s a semi-occluded (SOVT) exercise: the partial blockage creates back-pressure that lets your vocal folds vibrate with less effort. The bubbles show you instantly if your air stops flowing, which builds steady breath support.',
 song:[['Mapping a hard song safely','Sing the chorus of <i>When I Was Your Man</i> through the straw to learn the climb without straining, then sing it normally.'],['Recovery after a long day','Voice therapists use straw work for rehab. Use it when your voice feels tired from talking at work before you sing anything.']]},
rung:{n:7,what:'Singing patterns on the word <i>rung</i>, jaw dropped open vertically as far as is comfortable, tongue tip resting behind the lower front teeth. Light and moderately quiet, never heavy.',
 why:'The <i>ng</i> keeps the sound forward while the open jaw breaks the habit of a clamped or spread mouth. Kept light, it’s one of the best blenders for the tricky middle (mixed) voice.',
 song:[['Tenor choruses in the passaggio','A lot of Bruno Mars’s choruses sit right in the tenor middle zone, where voices crack or get shouty. <i>Rung</i> trains you to sail through it with an open jaw.'],['Big ballad climbs','OPM power ballads like Side A’s <i>Forevermore</i> climb into a high chorus. The open, relaxed jaw stops the top notes getting pinched.']]},
hinge:{n:8,what:'Gliding on a creaky, squeaky-hinge sound (often on <i>hmmm</i>), imagining the sound in the centre of your head. Aim high even on the low note, and let the sound get thinner and narrower as you go up.',
 why:'One of the best exercises for finding the mixed voice. With good placement and support it feels effortless right up to your top notes, and it can even soothe a hoarse voice.',
 song:[['Songs with a big range','When a song spans low verses to a high chorus, the squeaky door bridges that gap.'],['High mix instead of falsetto','When an R&amp;B chorus needs power up high (think <i>When I Was Your Man</i>), you want a strong mix, not a flip into breathy falsetto. This is where that mix starts.']]},
half:{n:9,what:'Part two of the squeaky door. You keep some of the squeak while blending in your normal singing tone, on <i>wah</i>, then <i>bow</i>, then <i>way/wah</i>, with the jaw dropped open.',
 why:'It’s the bridge from an odd exercise sound to your real singing voice. You keep the easy, forward placement of the squeak but with a tone you’d actually use on stage.',
 song:[['Practising the hard line','Sing whichever chorus line you keep cracking on half squeaky, half normal, then switch to full voice.'],['Keeping a climax easy','When a song builds to its last big chorus, this blend lets you add power without the throat taking over.']]},
vertical:{n:10,what:'Patterns on <i>mum</i>, then <i>lum</i>, then <i>yum</i>, keeping the mouth in a relaxed vertical oval rather than a wide smile.',
 why:'A spread, smiley mouth tightens the neck and makes high notes harder over time. The vertical shape gives a warmer tone and a freer throat; many singers find it brings a new sense of freedom.',
 song:[['Emotional high notes','The peak lines of a heartbreak ballad like <i>When I Was Your Man</i> are where singers grimace and spread. A vertical mouth keeps the tone warm instead of thin.'],['Smiling vs singing','Even on a happy last note, keeping the mouth tall in your mix keeps the tone full. The vertical <i>yum</i> is a favourite warm-up for exactly that.']]},
nasal:{n:11,what:'Deliberately nasal patterns on <i>may</i>, <i>me</i>, then <i>nay-yay</i>. The goal isn’t a nasal tone; it’s to lock in a forward placement.',
 why:'It strengthens low notes, which go muffled and muddy when the sound drops into the back of the throat. It also gives you another smooth route into the mixed middle range.',
 song:[['Low verses that need to carry','<i>Mee</i> and <i>may</i> bring muffled low notes forward, so a soft, low verse (like those in Daniel Caesar’s <i>Best Part</i>) stays clear instead of disappearing.'],['Bright, forward R&amp;B and pop tone','Healthy “twang” comes from this placement. It’s why upbeat Bruno Mars tracks like <i>24K Magic</i> sound bright and cut through a busy mix.']]},
flex:{n:12,what:'Scale patterns built on the pentatonic scale, on <i>woo</i>, <i>woh/wah</i>, then <i>he</i>. Learn them slowly and cleanly, then sing them a cappella, then speed them up.',
 why:'The pentatonic scale is the template most R&amp;B and gospel runs are built on. Drilling it builds agility and pitch accuracy at speed, but only if each tempo is clean before you go faster.',
 song:[['Runs and riffs','The melismas in R&amp;B ballads (Boyz II Men, Luther Vandross) are largely pentatonic shapes strung together.'],['Riffs that mean something','A riff should “say” something even without words. Once the shapes are automatic, you can focus on the feeling rather than the notes.'],['Your ad-libs','The final choruses of songs like <i>Leave the Door Open</i> are where runs go over the backing vocals.']]}
};

/* ===== Storage ===== */
const KEY='vocalTracker', DRAFT='vocalDraft';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Couldn’t save. Storage may be full.')}}
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT)||'null')}catch(e){return null}}
function saveDraft(){try{X?localStorage.setItem(DRAFT,JSON.stringify(X)):localStorage.removeItem(DRAFT)}catch(e){}}
let D=load();
function migrate(){
  if(!D.v2){
    D.ex=D.ex||{};
    const custom=(D.customRotations||[]).map((c,i)=>({id:'c'+i+'_'+Date.now().toString(36),name:c.name,focus:c.focus||'custom'}));
    const hist=D.rotationHistory||{};
    Object.keys(hist).forEach(k=>{const i=+k;const id=i<8?OLD_ROT_IDS[i]:(custom[i-8]||{}).id;if(id)D.ex[id]={n:(hist[k]||0),last:null};});
    D.custom=custom;D.v2=true;
  }
  D.ex=D.ex||{};D.custom=D.custom||[];D.songs=D.songs||[];D.sessions=D.sessions||[];D.months=D.months||{};
}
migrate();save();
let X=loadDraft();

/* ===== Recordings (IndexedDB) ===== */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('vocalTakes',1);r.onupgradeneeded=()=>r.result.createObjectStore('takes',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbp;}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('takes',mode);const out=fn(t.objectStore('takes'));t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);});}
const allTakes=()=>tx('readonly',s=>s.getAll()).then(r=>r||[]).catch(()=>[]);
const putTake=t=>tx('readwrite',s=>s.put(t));
const delTake=id=>tx('readwrite',s=>s.delete(id));
const clearTakes=()=>tx('readwrite',s=>s.clear()).catch(()=>{});
let TAKES=[];
async function refreshTakes(){TAKES=(await allTakes()).sort((a,b)=>a.created-b.created);}

function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function weekStart(d){const x=startOfDay(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function relDay(iso){const days=Math.round((startOfDay(new Date())-startOfDay(iso))/864e5);if(days<=0)return 'today';if(days===1)return 'yesterday';if(days<7)return days+' days ago';return shortDate(iso);}
function lastDone(id){const e=D.ex[id];if(e&&e.last)return 'last done '+relDay(e.last);if(e&&e.n)return 'last done before '+UPDATE_DAY;return 'Not done yet';}
function suggested(){const r=allRot();let best=r[0],min=Infinity;r.forEach(e=>{const n=(D.ex[e.id]||{}).n||0;if(n<min){min=n;best=e;}});return best;}
function minsIn(from,to){return D.sessions.filter(s=>{const t=new Date(s.date);return t>=from&&t<to;}).reduce((a,s)=>a+s.mins,0);}
function weekInfo(){
  const ws=weekStart(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);
  const mins=minsIn(ws,we);
  let streak=0;const w=new Date(ws);
  for(let i=0;i<520;i++){const a=new Date(w);a.setDate(a.getDate()-7);if(minsIn(a,w)>=WEEK_TARGET){streak++;w.setDate(w.getDate()-7);}else break;}
  if(mins>=WEEK_TARGET)streak++;
  const days=new Set(D.sessions.map(s=>startOfDay(s.date).getTime()));
  return {ws,mins,streak,days};
}

function newSession(){X={start:Date.now(),f:{},fNote:'',fEnd:null,rot:{},rNote:'',rEnd:null,song:null,rate:{},takes:[]};saveDraft();}

/* ===== Recording ===== */
function pickMime(){if(!window.MediaRecorder)return '';const c=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm'];return c.find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||'';}
async function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Recording isn’t supported in this browser');return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
  catch(e){toast('Microphone access was blocked. Allow it in Settings, then try again.');return;}
  const mime=pickMime();let mr;
  try{mr=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:64000},mime?{mimeType:mime}:{}));}catch(e){mr=new MediaRecorder(stream);}
  rec={mr,stream,chunks:[],t:0,songId:X.song,started:Date.now()};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)rec&&rec.chunks.push(e.data);};
  mr.onstop=saveRec;mr.start(1000);
  rec.timer=setInterval(()=>{if(!rec)return;rec.t=Math.round((Date.now()-rec.started)/1000);const l=$('recLbl');if(l)l.textContent='Stop · '+mmss(rec.t)+' of '+mmss(MAX_TAKE);if(rec.t>=MAX_TAKE)stopRec();},250);
  rerender();
}
function stopRec(){if(!rec||rec.stopping)return;rec.stopping=true;clearInterval(rec.timer);try{rec.mr.stop();}catch(e){saveRec();}rec.stream.getTracks().forEach(t=>t.stop());}
async function saveRec(){
  const r=rec;rec=null;if(!r)return;
  const type=(r.mr&&r.mr.mimeType)||(r.chunks[0]&&r.chunks[0].type)||'audio/mp4';
  const blob=new Blob(r.chunks,{type});
  const len=Math.max(1,Math.round((Date.now()-r.started)/1000));
  if(blob.size<1000){toast('That take was empty. Try again.');rerender();return;}
  const t={id:'t'+Date.now().toString(36),songId:r.songId,created:Date.now(),len,size:blob.size,type,star:false,blob};
  try{await putTake(t);if(X){X.takes.push(t.id);saveDraft();}}catch(e){toast('Couldn’t save the take. Storage may be full.');}
  await prune(r.songId);await refreshTakes();rerender();
}
async function prune(songId){const loose=(await allTakes()).filter(t=>t.songId===songId&&!t.star).sort((a,b)=>b.created-a.created);for(const t of loose.slice(KEEP_TAKES))await delTake(t.id);}
function stopPlayback(){if(player){player.pause();URL.revokeObjectURL(player.src);player=null;}playingId=null;}
function playTake(id){
  if(playingId===id){stopPlayback();rerender();return;}
  stopPlayback();const t=TAKES.find(x=>x.id===id);if(!t)return;
  player=new Audio(URL.createObjectURL(t.blob));playingId=id;
  player.onended=()=>{stopPlayback();rerender();};
  player.play().catch(()=>{stopPlayback();toast('Couldn’t play this take');rerender();});rerender();
}
function downloadFile(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
async function shareFile(file){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:file.name});return 'shared';}
    catch(e){if(e&&e.name==='AbortError')return 'cancelled';}
  }
  downloadFile(file);return 'downloaded';
}
function shareTake(id){
  const t=TAKES.find(x=>x.id===id);if(!t)return;
  const song=D.songs.find(s=>s.id===t.songId);
  const ext=/mp4|aac|m4a/.test(t.type)?'m4a':/webm/.test(t.type)?'webm':'audio';
  const name=((song?song.name:'Vocal take')+' – '+fileDate(new Date(t.created))).replace(/[\/\\:*?"<>|]/g,'-')+'.'+ext;
  shareFile(new File([t.blob],name,{type:t.type}));
}

/* ===== Backup ===== */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
function dataURLToBlob(u){const [head,b64]=u.split(',');const type=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type});}
async function prepareExport(){
  U.sheet='exporting';rerender();
  try{
    const takes=await allTakes();const out=[];
    for(const t of takes){const c=Object.assign({},t);delete c.blob;c.data=await blobToDataURL(t.blob);out.push(c);}
    const now=new Date();
    const payload={app:'vocal-sessions',format:1,appVersion:APP_VERSION,exportedAt:now.toISOString(),data:D,draft:X,takes:out};
    const file=new File([JSON.stringify(payload)],'Vocal Sessions backup – '+fileDate(now)+'.json',{type:'application/json'});
    pendingExport={file,at:payload.exportedAt,sessions:D.sessions.length,takes:out.length};
    U.sheet='exportReady';
  }catch(e){U.sheet=null;toast('Couldn’t create the backup. Try again.');}
  rerender();
}
async function saveExport(){
  const p=pendingExport;if(!p)return;
  const r=await shareFile(p.file);
  if(r==='cancelled'){toast('Backup not saved');return;}
  D.lastBackup=p.at;save();pendingExport=null;U.sheet=null;rerender();toast(r==='shared'?'Backup saved':'Backup downloaded');
}
function readImport(file){
  const r=new FileReader();
  r.onload=()=>{let p;try{p=JSON.parse(r.result);}catch(e){p=null;}
    if(!p||p.app!=='vocal-sessions'||!p.data){toast('That file isn’t a Vocal Sessions backup');return;}
    pendingImport=p;U.sheet='importConfirm';rerender();};
  r.onerror=()=>toast('Couldn’t read that file');
  r.readAsText(file);
}
async function restoreImport(){
  const p=pendingImport;if(!p)return;
  U.sheet='importing';rerender();
  try{
    stopPlayback();if(rec)stopRec();
    await clearTakes();
    for(const t of (p.takes||[])){const c=Object.assign({},t);c.blob=dataURLToBlob(t.data);delete c.data;await putTake(c);}
    D=p.data;migrate();D.lastBackup=p.exportedAt;save();
    X=p.draft||null;saveDraft();
    await refreshTakes();pendingImport=null;
    U={tab:'today',view:null,exId:null,exTab:'summary',sheet:null,sd:{}};window.scrollTo(0,0);render();toast('Backup restored');
  }catch(e){U.sheet=null;rerender();toast('Couldn’t restore that backup');}
}

/* ===== Copy ===== */
function copyText(txt){
  const ok=()=>toast('Copied for Toggl');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);let s=false;try{s=document.execCommand('copy');}catch(e){}ta.remove();s?ok():toast('Copy failed. Try again.');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
}

/* ===== Swipe to delete ===== */
let swT=null,swOpen=null,swJustMoved=0;
function closeSwipes(except){document.querySelectorAll('.sw.open').forEach(s=>{if(s!==except){s.classList.remove('open');s.querySelector('.fg').style.transform='';}});if(!except)swOpen=null;}
document.addEventListener('touchstart',e=>{const s=e.target.closest('.sw');if(swOpen&&swOpen!==s)closeSwipes();if(!s)return;const t=e.touches[0];swT={s,x:t.clientX,y:t.clientY,dx:0,base:s.classList.contains('open')?-88:0,lock:null};},{passive:true});
document.addEventListener('touchmove',e=>{if(!swT)return;const t=e.touches[0],dx=t.clientX-swT.x,dy=t.clientY-swT.y;
  if(swT.lock===null){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;swT.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';}
  if(swT.lock!=='x')return;swT.dx=dx;swT.s.classList.add('dragging');
  const x=Math.max(-120,Math.min(0,swT.base+dx));swT.s.querySelector('.fg').style.transform='translateX('+x+'px)';},{passive:true});
document.addEventListener('touchend',()=>{if(!swT)return;const s=swT.s;s.classList.remove('dragging');
  if(swT.lock==='x'){swJustMoved=Date.now();const x=swT.base+swT.dx;const open=x<-44;s.classList.toggle('open',open);s.querySelector('.fg').style.transform=open?'translateX(-88px)':'';swOpen=open?s:null;}
  swT=null;});

/* ===== Events ===== */
$('importIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)readImport(f);});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(Date.now()-swJustMoved<350&&!(el&&el.classList.contains('swdel'))){e.preventDefault();return;}
  if(swOpen&&!(el&&el.classList.contains('swdel'))&&!e.target.closest('.scrim')){const inOpen=e.target.closest('.sw')===swOpen;closeSwipes();if(inOpen){e.preventDefault();return;}}
  if(!el)return;
  if(el.classList.contains('scrim')&&e.target!==el)return;
  const a=el.dataset.a,v=el.dataset.v,k=el.dataset.k;
  switch(a){
    case 'tab':go(()=>{U.tab=v;U.view=null;});break;
    case 'start':newSession();go(()=>{U.view='found';});break;
    case 'resume':go(()=>{U.view=X.fEnd?(X.rEnd?'app':'rot'):'found';});break;
    case 'discardYes':if(rec)stopRec();X=null;saveDraft();U.sheet=null;rerender();break;
    case 'exit':go(()=>{U.view=null;U.tab='today';});break;
    case 'view':go(()=>{U.view=v;});break;
    case 'openEx':go(()=>{U.prevTab=U.tab;U.view='ex';U.exId=k;U.exTab='summary';});break;
    case 'exBack':go(()=>{U.view=null;U.tab=U.prevTab||'exercises';});break;
    case 'exTab':U.exTab=v;rerender();break;
    case 'flv':X.f[k]=+v;saveDraft();rerender();break;
    case 'rlv':X.rot[k]=+v;saveDraft();rerender();break;
    case 'rate':X.rate[k]=+v;saveDraft();rerender();break;
    case 'tog':if(k in X.rot)delete X.rot[k];else X.rot[k]=0;saveDraft();rerender();break;
    case 'song':if(rec)return toast('Stop recording first');stopPlayback();X.song=k;saveDraft();rerender();break;
    case 'rec':rec?stopRec():startRec();break;
    case 'playTake':playTake(k);break;
    case 'shareTake':shareTake(k);break;
    case 'star':(async()=>{const t=TAKES.find(x=>x.id===k);if(!t)return;t.star=!t.star;await putTake(t);if(!t.star)await prune(t.songId);await refreshTakes();rerender();})();break;
    case 'cta':
      if(U.view==='found'){if(FOUND.some(x=>!X.f[x.id]))return toast('Set a level for each exercise');U.sheet='confirmF';rerender();}
      else if(U.view==='rot'){const ks=Object.keys(X.rot);if(!ks.length)return toast('Pick at least one exercise');if(ks.some(i=>!X.rot[i]))return toast('Set a level for each exercise you picked');X.rEnd=Date.now();saveDraft();go(()=>{U.view='app';});}
      else if(U.view==='app'){if(rec)return toast('Stop recording first');stopPlayback();finishSession();}
      break;
    case 'confirmF':X.fEnd=Date.now();saveDraft();U.sheet=null;go(()=>{U.view='rot';});break;
    case 'sheet':U.sheet=v;U.sd={k};rerender();break;
    case 'close':U.sheet=null;pendingImport=null;rerender();break;
    case 'preset':{const i=$('noteIn');if(i)i.value=v;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));break;}
    case 'saveNote':{const i=$('noteIn');X[U.sd.k]=(i?i.value:'').trim();saveDraft();U.sheet=null;rerender();break;}
    case 'clearNote':X[U.sd.k]='';saveDraft();U.sheet=null;rerender();break;
    case 'focus':document.querySelectorAll('#focusChips .chip').forEach(c=>c.classList.toggle('on',c===el));break;
    case 'saveEx':{const n=($('exName').value||'').trim(),err=$('exErr');
      if(!n){err.textContent='Enter a name';err.hidden=false;return;}
      const f=(document.querySelector('#focusChips .chip.on')||{}).dataset;
      const id='c_'+Date.now().toString(36);D.custom.push({id,name:n,focus:f?f.v:'custom',what:($('exWhat').value||'').trim()});save();
      if(X&&U.view==='rot'){X.rot[id]=0;saveDraft();}
      U.sheet=null;rerender();toast('Exercise added');break;}
    case 'saveWhat':{const e=D.custom.find(x=>x.id===k);if(e){e.what=($('whatIn').value||'').trim();save();}U.sheet=null;rerender();break;}
    case 'saveSong':{const n=($('songIn').value||'').trim(),err=$('songErr');if(!n){err.textContent='Enter a song name';err.hidden=false;return;}
      const id='g_'+Date.now().toString(36);D.songs.push({id,name:n});save();if(X&&U.view==='app'){X.song=id;saveDraft();}U.sheet=null;rerender();toast('Song added');break;}
    case 'delEx':D.custom=D.custom.filter(x=>x.id!==k);save();if(X&&k in X.rot){delete X.rot[k];saveDraft();}if(U.view==='ex'&&U.exId===k){U.view=null;}U.sheet=null;rerender();toast('Exercise deleted');break;
    case 'delSong':(async()=>{D.songs=D.songs.filter(x=>x.id!==k);save();for(const t of TAKES.filter(t=>t.songId===k))await delTake(t.id);if(X&&X.song===k){X.song=null;saveDraft();}await refreshTakes();U.sheet=null;rerender();toast('Song deleted');})();break;
    case 'delTake':(async()=>{if(playingId===k)stopPlayback();await delTake(k);await refreshTakes();U.sheet=null;rerender();toast('Take deleted');})();break;
    case 'delSession':deleteSession(k);U.sheet=null;rerender();toast('Session deleted');break;
    case 'clearRec':(async()=>{stopPlayback();await clearTakes();await refreshTakes();U.sheet=null;rerender();toast('Recordings deleted');})();break;
    case 'resetMonth':D.months[monthKey()]=0;save();U.sheet=null;rerender();toast('This month reset');break;
    case 'resetAll':(async()=>{stopPlayback();await clearTakes();D={v2:true};migrate();save();X=null;saveDraft();await refreshTakes();U={tab:'today',view:null,exId:null,exTab:'summary',sheet:null,sd:{}};render();toast('All data deleted');})();break;
    case 'copy':{const ss=D.sessions.find(x=>x.id===k);if(ss)copyText(togglLines(ss));break;}
    case 'exportPrep':prepareExport();break;
    case 'exportSave':saveExport();break;
    case 'importPick':$('importIn').click();break;
    case 'importYes':restoreImport();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sheet){U.sheet=null;rerender();}});
window.addEventListener('scroll',()=>{closeSwipes();$('bar').classList.toggle('scrolled',window.scrollY>36);},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&rec)stopRec();});

render();
refreshTakes().then(rerender);
</script>
