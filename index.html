<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocal">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Vocal Sessions</title>
<style>
:root{
  --bg:#f2f2f7;--surface:#ffffff;--fg:#000000;--fg2:#6c6c72;--fg3:#a3a3a8;
  --sep:rgba(60,60,67,0.16);--fill:rgba(118,118,128,0.12);
  --accent:#007aff;--on-accent:#ffffff;--danger:#ff3b30;--star:#ff9f0a;--rec:#ff3b30;
  --glass:rgba(250,250,252,0.62);--glass-strong:rgba(250,250,252,0.82);
  --glass-edge:rgba(0,0,0,0.09);--glass-hi:rgba(255,255,255,0.95);
  --glass-shadow:rgba(20,20,40,0.14);--scrim:rgba(0,0,0,0.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--surface:#1c1c1e;--fg:#ffffff;--fg2:#98989f;--fg3:#5c5c61;
  --sep:rgba(84,84,88,0.5);--fill:rgba(118,118,128,0.24);
  --accent:#0a84ff;--danger:#ff453a;--star:#ffb340;--rec:#ff453a;
  --glass:rgba(40,40,44,0.58);--glass-strong:rgba(44,44,48,0.82);
  --glass-edge:rgba(0,0,0,0.6);--glass-hi:rgba(255,255,255,0.2);
  --glass-shadow:rgba(0,0,0,0.5);--scrim:rgba(0,0,0,0.5);color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:430px;margin:0 auto;position:relative}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 0.5px var(--glass-edge),0 8px 28px var(--glass-shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;margin:0 -8px;padding:0 8px;border-radius:0 0 22px 22px;transition:background .25s,box-shadow .25s}
.bar:not(.scrolled){background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.bar .mt{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.bar.scrolled .mt{opacity:1}
.side{width:88px;display:flex}.side.r{justify-content:flex-end}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.pill{font-size:13px;font-weight:600;color:var(--fg2);padding:9px 12px;border-radius:999px;white-space:nowrap}

h1{font-size:34px;font-weight:700;letter-spacing:0.01em;margin:0 4px 6px}
.note{font-size:13px;color:var(--fg2);margin:0 4px 14px;line-height:1.4}
.hdr{font-size:13px;color:var(--fg2);margin:22px 16px 7px;text-transform:uppercase;letter-spacing:0.03em}
.grp{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:6px 16px;position:relative;width:100%}
.grp>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:0.5px solid var(--sep)}
.grp>.sub::before{display:none}
.lbl{flex:1;min-width:0}
.lbl small{display:block;font-size:13px;color:var(--fg2);margin-top:2px}
.mut{color:var(--fg2)}.acc{color:var(--accent)}.dng{color:var(--danger)}
.sub{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;gap:10px;position:relative}
.tag{font-size:13px;color:var(--fg2)}
.yt{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;min-height:44px}
.yt svg{width:14px;height:14px;fill:currentColor;stroke:none}
a.exname{display:flex;flex-direction:column;justify-content:center;min-height:44px}
a.exname span{display:inline-flex;align-items:center;gap:6px}
a.exname svg{width:12px;height:12px;fill:var(--accent);stroke:none;flex-shrink:0}

.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.seg button{min-width:44px;height:34px;border-radius:999px;font-size:15px;font-weight:500;color:var(--fg2);text-align:center;transition:background .15s,color .15s}
.seg button.on{color:var(--fg);background:var(--surface);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 8px var(--glass-shadow),inset 0 0 0 0.5px var(--glass-edge)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;color:var(--fg)}
.chip.on{background:var(--accent);color:var(--on-accent)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:14px 16px}
.stat small{display:block;font-size:13px;color:var(--fg2)}
.stat b{display:block;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.track i.full{background:#34c759}

.cta{display:block;height:54px;border-radius:999px;font-size:17px;font-weight:600;color:var(--on-accent);background:var(--accent);text-align:center;width:100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),inset 0 0 0 0.5px rgba(0,0,0,0.12),0 8px 24px var(--glass-shadow)}
.cta.sec{background:var(--surface);color:var(--accent);box-shadow:none}
.cta:active,.circ:active,.row:active,.chip:active,.tabbar button:active{transform:scale(0.98)}
.ghost{display:block;width:100%;text-align:center;height:48px;color:var(--accent);font-weight:500;margin-top:4px}

main{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.dock .in{max-width:430px;margin:0 auto;pointer-events:auto}
.tabbar{display:flex;gap:2px;padding:5px;border-radius:999px;max-width:320px;margin:0 auto}
.tabbar button{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--fg);gap:3px;text-align:center}
.tabbar button.on{color:var(--accent);background:var(--fill)}

.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;margin:0 8px calc(8px + env(safe-area-inset-bottom,0px));border-radius:34px;padding:10px 16px 16px;background:var(--glass-strong);animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:700;margin:0 4px 12px}
.sheet .grp{background:var(--surface)}
.sheet .hdr{margin-top:16px}
.field{width:100%;min-height:48px;border-radius:14px;background:var(--surface);border:0;padding:12px 14px;outline:none}
textarea.field{resize:none;min-height:84px;line-height:1.35}
.err{font-size:13px;color:var(--danger);margin:6px 4px 0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.empty{padding:22px 16px;text-align:center;color:var(--fg2);font-size:15px;line-height:1.4}
.recbtn{justify-content:center;gap:10px;color:var(--fg)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--rec);display:inline-block;transition:border-radius .2s}
.recbtn.on .dot{border-radius:3px}
.recbtn.on{color:var(--rec);font-variant-numeric:tabular-nums}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}
.ibtn svg{width:20px;height:20px}
.star svg{fill:none}.star.on{color:var(--star)}.star.on svg{fill:currentColor}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar glass" id="bar">
    <span class="side" id="barL"></span>
    <span class="mt" id="barT"></span>
    <span class="side r" id="barR"></span>
  </header>
  <main id="app"></main>
</div>
<div class="dock"><div class="in" id="dock"></div></div>
<div id="layer"></div>

<script>
/* ===== Config ===== */
const VIDEO='https://youtu.be/rG-o10NggDI';
const TARGET=280;
const FOUND=[
  {id:'slides',name:'Vocal slides',focus:'agility',ts:0},
  {id:'humming',name:'Humming',focus:'cord-closure',ts:435},
  {id:'lip',name:'Lip bubbling',focus:'cord-closure',ts:790},
  {id:'straw',name:'Singing through a straw',focus:'cord-closure',ts:1605}];
const ROT=[
  {id:'falsetto',name:'Falsetto voice',focus:'register',ts:1170},
  {id:'upperlower',name:'Upper to lower voice',focus:'register',ts:1485},
  {id:'rung',name:'Singing on the rung',focus:'resonance',ts:1960},
  {id:'hinge',name:'Squeaky hinge',focus:'register',ts:2480},
  {id:'half',name:'Half squeaky / half normal',focus:'blend',ts:2917},
  {id:'vertical',name:'Vertical mouth',focus:'resonance',ts:3410},
  {id:'nasal',name:'Nasal exercise',focus:'resonance',ts:3870},
  {id:'flex',name:'Vocal flexibility',focus:'agility',ts:4260}];
const OLD_ROT_IDS=['falsetto','upperlower','rung','hinge','half','vertical','nasal','flex'];
const FOCI=['cord-closure','register','resonance','agility','blend'];
const NOTE_PRESETS=['Felt good placement','Tight today','Clear tone','Cracking on passaggio','Flat pitch','Register blend improving','Needed more warm-up'];
const MAX_TAKE=120, KEEP_TAKES=3;

/* ===== Storage (localStorage, same key as v1 so old data carries over) ===== */
const KEY='vocalTracker', DRAFT='vocalDraft';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Couldn’t save. Storage may be full.')}}
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT)||'null')}catch(e){return null}}
function saveDraft(){try{X?localStorage.setItem(DRAFT,JSON.stringify(X)):localStorage.removeItem(DRAFT)}catch(e){}}
let D=load();
(function migrate(){
  if(D.v2)return;
  D.ex=D.ex||{};
  const custom=(D.customRotations||[]).map((c,i)=>({id:'c'+i+'_'+Date.now().toString(36),name:c.name,focus:c.focus||'custom',ts:null}));
  const hist=D.rotationHistory||{};
  Object.keys(hist).forEach(k=>{const i=+k;const id=i<8?OLD_ROT_IDS[i]:(custom[i-8]||{}).id;if(id)D.ex[id]={n:(hist[k]||0),last:null};});
  D.custom=custom;D.songs=D.songs||[];D.sessions=D.sessions||[];D.months=D.months||{};
  D.v2=true;save();
})();
let X=loadDraft(); // in-progress session

/* ===== Recordings (IndexedDB) ===== */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('vocalTakes',1);r.onupgradeneeded=()=>r.result.createObjectStore('takes',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbp;}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('takes',mode);const s=t.objectStore('takes');const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);});}
const allTakes=()=>tx('readonly',s=>s.getAll()).catch(()=>[]);
const putTake=t=>tx('readwrite',s=>s.put(t));
const delTake=id=>tx('readwrite',s=>s.delete(id));
const clearTakes=()=>tx('readwrite',s=>s.clear()).catch(()=>{});
let TAKES=[];
async function refreshTakes(){TAKES=(await allTakes()).sort((a,b)=>a.created-b.created);}

/* ===== Helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x;};
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';};
const monthKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthMins=()=>(D.months||{})[monthKey()]||0;
const dayLabel=iso=>new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fileDate=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const ytUrl=ts=>VIDEO+(ts?'?t='+ts:'');
const allRot=()=>ROT.concat((D.custom||[]).map(c=>Object.assign({custom:true},c)));
const exById=id=>FOUND.concat(allRot()).find(e=>e.id===id);
const parseTs=v=>{v=(v||'').trim();if(!v)return null;const m=v.match(/^(?:(\d+):)?(\d{1,2}):(\d{2})$/);if(!m)return NaN;return (+(m[1]||0))*3600+(+m[2])*60+(+m[3]);};
const streakNow=()=>{const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();return (D.lastDate===t||D.lastDate===y)?(D.streak||0):0;};
function suggested(){const r=allRot();let best=r[0],min=Infinity;r.forEach(e=>{const n=(D.ex[e.id]||{}).n||0;if(n<min){min=n;best=e;}});return best;}
const ICON={
  mic:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  list:'<svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  play:'<svg class="i" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/></svg>',
  pause:'<svg class="i" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',
  star:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  share:'<svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M6 11H5v10h14V11h-1"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M5 12l5 5 9-10"/></svg>',
  yt:'<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  circle:'<svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px"><circle cx="12" cy="12" r="9.5"/></svg>',
  circleOn:'<svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M7.5 12.2l3 3 6-6.4" stroke="#fff"/></svg>'
};
const chev='<span class="mut" aria-hidden="true" style="font-size:20px">›</span>';
const seg=(a,key,v)=>'<div class="seg" role="group">'+[1,2,3].map(n=>'<button data-a="'+a+'" data-k="'+esc(key)+'" data-v="'+n+'" class="'+(v===n?'on':'')+'" aria-pressed="'+(v===n)+'" aria-label="Level '+n+'">'+n+'</button>').join('')+'</div>';
const ytLink=(ts,label)=>ts==null?'':'<a class="yt" href="'+ytUrl(ts)+'" target="_blank" rel="noopener">'+ICON.yt+(label||'Watch')+'</a>';
const exName=e=>e.ts==null?'<span class="lbl">'+esc(e.name)+'</span>':'<a class="lbl exname" href="'+ytUrl(e.ts)+'" target="_blank" rel="noopener" aria-label="'+esc(e.name)+', open coach video at '+mmss(e.ts)+'"><span>'+esc(e.name)+ICON.yt+'</span></a>';

/* ===== UI state ===== */
let U={tab:'today',view:null,sheet:null,sd:{}};
let rec=null; // {mr,stream,chunks,t,timer,songId}
let player=null,playingId=null;

/* ===== Screens ===== */
function scrToday(){
  const mm=monthMins(),p=Math.min(100,Math.round(mm/TARGET*100)),s=suggested(),st=streakNow();
  return '<h1>Today</h1>'+
  '<div class="stats" style="margin-top:8px"><div class="stat"><small>Streak</small><b>'+st+' day'+(st===1?'':'s')+'</b></div><div class="stat"><small>This month</small><b>'+hm(mm)+'</b></div></div>'+
  '<div class="grp" style="margin-top:10px"><div class="row" style="display:block;padding:14px 16px"><div style="display:flex;justify-content:space-between;gap:8px"><span>Monthly target</span><span class="mut">'+Math.round(mm)+' of '+TARGET+' min</span></div><div class="track"><i class="'+(p>=100?'full':'')+'" style="width:'+p+'%"></i></div></div></div>'+
  '<div style="margin-top:16px">'+(X?'<button class="cta" data-a="resume">Resume session</button><button class="ghost" data-a="discard">Discard session</button>':'<button class="cta" data-a="start">Start session</button>')+'</div>'+
  '<div class="hdr">Suggested rotation</div><div class="grp"><div class="row">'+exName(s)+'<span class="tag">'+esc(s.focus)+'</span></div></div>'+
  '<div class="hdr">Settings</div><div class="grp">'+
    '<button class="row" data-a="sheet" data-v="storage"><span class="lbl">Recordings</span><span class="mut" id="storeSize">…</span>'+chev+'</button>'+
    '<button class="row" data-a="sheet" data-v="resetMonth"><span class="lbl dng">Reset this month’s minutes</span></button>'+
    '<button class="row" data-a="sheet" data-v="resetAll"><span class="lbl dng">Reset all data</span></button></div>';
}
function scrHistory(){
  const ss=(D.sessions||[]).slice().reverse();
  let h='<h1>History</h1>';
  if(!ss.length)return h+'<div class="grp" style="margin-top:8px"><div class="empty">Your finished sessions will appear here, with levels, songs and ratings.</div></div>';
  let cur='';
  ss.forEach(s=>{const k=monthKey(new Date(s.date));if(k!==cur){if(cur)h+='</div>';cur=k;const lab=new Date(s.date).toLocaleDateString('en-GB',{month:'long',year:'numeric'});h+='<div class="hdr">'+lab+' · <span style="text-transform:none">'+hm((D.months||{})[k]||0)+'</span></div><div class="grp">';}
    const rots=Object.keys(s.rot||{}).map(id=>(exById(id)||{name:s.rotNames&&s.rotNames[id]||'Exercise'}).name);
    h+='<button class="row" data-a="sheet" data-v="session" data-k="'+s.id+'"><span class="lbl">'+dayLabel(s.date)+'<small>'+esc(rots.length?rots.join(', '):'Foundation only')+'</small></span><span class="mut">'+hm(s.mins)+'</span>'+chev+'</button>';});
  return h+'</div>';
}
function scrExercises(){
  const stat=id=>{const e=D.ex[id];if(!e||!e.n)return 'Not done yet';return 'Done '+e.n+'×'+(e.last?' · last '+new Date(e.last).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'');};

function newSession(){X={start:Date.now(),f:{},fNote:'',fEnd:null,rot:{},rNote:'',rEnd:null,song:null,rate:{},takes:[]};saveDraft();}

function finishSession(){
  const end=Date.now(),mins=Math.max(1,Math.round((end-X.start)/60000));

  const rotNames={};Object.keys(X.rot).forEach(id=>{const e=exById(id);if(e)rotNames[id]=e.name;});
  const ss={id:'s'+end.toString(36),date:new Date(X.start).toISOString(),mins,f:X.f,fNote:X.fNote,rot:X.rot,rNote:X.rNote,rotNames,songName:song?song.name:'',rate:X.rate,takes:X.takes};
  D.sessions=D.sessions||[];D.sessions.push(ss);

  if(D.lastDate!==t){D.streak=D.lastDate===y?(D.streak||0)+1:1;D.lastDate=t;}

  U.view=null;U.tab='today';U.sheet='done';U.sd={k:ss.id};window.scrollTo(0,0);render();
}

/* ===== Recording ===== */
function pickMime(){if(!window.MediaRecorder)return '';const c=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm'];return c.find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||'';}
async function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Recording isn’t supported in this browser');return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
  catch(e){toast('Microphone access was blocked. Allow it in Settings, then try again.');return;}
  const mime=pickMime();let mr;
  try{mr=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:64000},mime?{mimeType:mime}:{}));}catch(e){mr=new MediaRecorder(stream);}
  rec={mr,stream,chunks:[],t:0,songId:X.song,started:Date.now()};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data);};
  mr.onstop=saveRec;
  mr.start(1000);
  rec.timer=setInterval(()=>{if(!rec)return;rec.t=Math.round((Date.now()-rec.started)/1000);const l=$('recLbl');if(l)l.textContent='Stop · '+mmss(rec.t)+' of '+mmss(MAX_TAKE);if(rec.t>=MAX_TAKE)stopRec();},250);
  rerender();
}
function stopRec(){if(!rec||rec.stopping)return;rec.stopping=true;clearInterval(rec.timer);try{rec.mr.stop();}catch(e){saveRec();}rec.stream.getTracks().forEach(t=>t.stop());}
async function saveRec(){
  const r=rec;rec=null;if(!r)return;
  const type=(r.mr&&r.mr.mimeType)||(r.chunks[0]&&r.chunks[0].type)||'audio/mp4';
  const blob=new Blob(r.chunks,{type});
  const len=Math.max(1,Math.round((Date.now()-r.started)/1000));
  if(blob.size<1000){toast('That take was empty. Try again.');rerender();return;}
  const t={id:'t'+Date.now().toString(36),songId:r.songId,created:Date.now(),len,size:blob.size,type,star:false,blob};
  try{await putTake(t);if(X){X.takes.push(t.id);saveDraft();}}catch(e){toast('Couldn’t save the take. Storage may be full.');}
  await prune(r.songId);await refreshTakes();rerender();
}
async function prune(songId){const loose=(await allTakes()).filter(t=>t.songId===songId&&!t.star).sort((a,b)=>b.created-a.created);for(const t of loose.slice(KEEP_TAKES))await delTake(t.id);}
function stopPlayback(){if(player){player.pause();URL.revokeObjectURL(player.src);player=null;}playingId=null;}
function playTake(id){
  if(playingId===id){stopPlayback();rerender();return;}
  stopPlayback();const t=TAKES.find(x=>x.id===id);if(!t)return;
  player=new Audio(URL.createObjectURL(t.blob));playingId=id;
  player.onended=()=>{stopPlayback();rerender();};
  player.play().catch(()=>{stopPlayback();toast('Couldn’t play this take');rerender();});rerender();
}
async function shareTake(id){
  const t=TAKES.find(x=>x.id===id);if(!t)return;
  const song=(D.songs||[]).find(s=>s.id===t.songId);
  const ext=/mp4|aac|m4a/.test(t.type)?'m4a':/webm/.test(t.type)?'webm':'audio';
  const name=((song?song.name:'Vocal take')+' – '+fileDate(new Date(t.created))).replace(/[\/\\:*?"<>|]/g,'-')+'.'+ext;
  const file=new File([t.blob],name,{type:t.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});}catch(e){}return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}

/* ===== Copy ===== */
function copyText(txt){
  const ok=()=>toast('Copied for Toggl');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);let s=false;try{s=document.execCommand('copy');}catch(e){}ta.remove();s?ok():toast('Copy failed. Try again.');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
}

/* ===== Events ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('scrim')&&e.target!==el)return;
  const a=el.dataset.a,v=el.dataset.v,k=el.dataset.k;
  switch(a){
    case 'tab':go(()=>{U.tab=v;});break;
    case 'start':newSession();go(()=>{U.view='found';});break;
    case 'resume':go(()=>{U.view=X.fEnd?(X.rEnd?'app':'rot'):'found';});break;
    case 'discard':U.sheet='discard';rerender();break;
    case 'discardYes':if(rec)stopRec();X=null;saveDraft();U.sheet=null;rerender();break;
    case 'exit':go(()=>{U.view=null;U.tab='today';});break;
    case 'view':go(()=>{U.view=v;});break;
    case 'flv':X.f[k]=+v;saveDraft();rerender();break;
    case 'rlv':X.rot[k]=+v;saveDraft();rerender();break;
    case 'rate':X.rate[k]=+v;saveDraft();rerender();break;
    case 'tog':if(k in X.rot)delete X.rot[k];else X.rot[k]=0;saveDraft();rerender();break;
    case 'song':if(rec)return toast('Stop recording first');stopPlayback();X.song=k;saveDraft();rerender();break;
    case 'rec':rec?stopRec():startRec();break;
    case 'playTake':playTake(k);break;
    case 'shareTake':shareTake(k);break;
    case 'star':(async()=>{const t=TAKES.find(x=>x.id===k);if(!t)return;t.star=!t.star;await putTake(t);if(!t.star)await prune(t.songId);await refreshTakes();rerender();})();break;
    case 'cta':
      if(U.view==='found'){if(FOUND.some(x=>!X.f[x.id]))return toast('Set a level for each exercise');U.sheet='confirmF';rerender();}
      else if(U.view==='rot'){const ks=Object.keys(X.rot);if(!ks.length)return toast('Pick at least one exercise');if(ks.some(i=>!X.rot[i]))return toast('Set a level for each exercise you picked');X.rEnd=Date.now();saveDraft();go(()=>{U.view='app';});}
      else if(U.view==='app'){if(rec)return toast('Stop recording first');stopPlayback();finishSession();}
      break;
    case 'confirmF':X.fEnd=Date.now();saveDraft();U.sheet=null;go(()=>{U.view='rot';});break;
    case 'sheet':U.sheet=v;U.sd={k};rerender();break;
    case 'close':U.sheet=null;rerender();break;
    case 'preset':{const i=$('noteIn');if(i)i.value=v;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));break;}
    case 'saveNote':{const i=$('noteIn');X[U.sd.k]=(i?i.value:'').trim();saveDraft();U.sheet=null;rerender();break;}
    case 'clearNote':X[U.sd.k]='';saveDraft();U.sheet=null;rerender();break;
    case 'focus':document.querySelectorAll('#focusChips .chip').forEach(c=>c.classList.toggle('on',c===el));break;
    case 'saveEx':{const n=($('exName').value||'').trim(),err=$('exErr');const ts=parseTs($('exTs').value);
      if(!n){err.textContent='Enter a name';err.hidden=false;return;}
      if(Number.isNaN(ts)){err.textContent='Write the timestamp like 41:20 or 1:04:30';err.hidden=false;return;}
      const f=(document.querySelector('#focusChips .chip.on')||{}).dataset;
      D.custom=D.custom||[];const id='c_'+Date.now().toString(36);D.custom.push({id,name:n,focus:f?f.v:'custom',ts});save();
      if(U.view==='rot'){X.rot[id]=0;saveDraft();}
      U.sheet=null;rerender();toast('Exercise added');break;}
    case 'saveSong':{const n=($('songIn').value||'').trim(),err=$('songErr');if(!n){err.textContent='Enter a song name';err.hidden=false;return;}
      D.songs=D.songs||[];const id='g_'+Date.now().toString(36);D.songs.push({id,name:n});save();if(X&&U.view==='app'){X.song=id;saveDraft();}U.sheet=null;rerender();toast('Song added');break;}
    case 'delEx':D.custom=(D.custom||[]).filter(x=>x.id!==k);save();if(X&&k in X.rot){delete X.rot[k];saveDraft();}U.sheet=null;rerender();break;
    case 'delSong':(async()=>{D.songs=(D.songs||[]).filter(x=>x.id!==k);save();for(const t of TAKES.filter(t=>t.songId===k))await delTake(t.id);if(X&&X.song===k){X.song=null;saveDraft();}await refreshTakes();U.sheet=null;rerender();})();break;
    case 'clearRec':(async()=>{stopPlayback();await clearTakes();await refreshTakes();U.sheet=null;rerender();toast('Recordings deleted');})();break;
    case 'resetMonth':D.months=D.months||{};D.months[monthKey()]=0;save();U.sheet=null;rerender();toast('This month reset');break;
    case 'resetAll':(async()=>{stopPlayback();try{localStorage.removeItem(KEY);localStorage.removeItem(DRAFT);}catch(e){}await clearTakes();D={v2:true,ex:{},custom:[],songs:[],sessions:[],months:{}};save();X=null;await refreshTakes();U={tab:'today',view:null,sheet:null,sd:{}};render();toast('All data deleted');})();break;
    case 'delSession':{const ss=(D.sessions||[]).find(x=>x.id===k);if(ss){const mk=monthKey(new Date(ss.date));D.months[mk]=Math.max(0,(D.months[mk]||0)-ss.mins);D.sessions=D.sessions.filter(x=>x.id!==k);save();}U.sheet=null;rerender();toast('Session deleted');break;}
    case 'copy':{const ss=(D.sessions||[]).find(x=>x.id===k);if(ss)copyText(togglLines(ss));break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sheet){U.sheet=null;rerender();}});
window.addEventListener('scroll',()=>$('bar').classList.toggle('scrolled',window.scrollY>36),{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&rec)stopRec();});

render();
refreshTakes().then(rerender);
</script>
</body>
</html>
